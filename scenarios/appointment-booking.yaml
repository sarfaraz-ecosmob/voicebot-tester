name: Appointment booking
description: Collects customer name, date, time and reason, then validates the mock slot and confirms the booking.
version: 1
timezone: Asia/Kolkata
required_fields:
  - customer_name
  - appointment_date
  - appointment_time
  - reason
mock_slot:
  date: "2026-10-23"
  time: "11:00"
  available: true
assertions:
  - intent equals book_appointment
  - all_required_fields_present
  - availability_checked
  - booking_status equals confirmed
