; =============================================================================
; Voicebot Testing - PJSIP configuration
;
; Two WebRTC test extensions that register from the browser SIP panel:
;   1001 / voicebot-1001
;   1002 / voicebot-1002
;
; Signaling: ws://localhost:8080/ws  and  wss://localhost:8089/ws
; Media:     RTP 10000-10100/udp (published in compose.yaml)
; =============================================================================

[global]
type = global

; --- Transports -------------------------------------------------------------

[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0:8080
; Address advertised in SDP for RTP. The default 127.0.0.1 works for a browser
; on the same machine: media flows through Docker's published RTP ports.
; Set ASTERISK_EXTERNAL_MEDIA_ADDRESS in .env to your host LAN IP when a
; softphone on another device must reach the media path.
external_media_address = __ASTERISK_EXTERNAL_MEDIA_ADDRESS__

[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0:8089
external_media_address = __ASTERISK_EXTERNAL_MEDIA_ADDRESS__
; TLS material for wss:// is configured in http.conf (tlscertfile/tlsprivatekey).

; --- Extension 1001 ----------------------------------------------------------

[1001]
type = endpoint
transport = transport-ws
context = from-webrtc
aors = 1001
callerid = "Voicebot Tester 1001" <1001>
disallow = all
allow = ulaw
allow = alaw
allow = g722
; WebRTC profile: DTLS-SRTP, ICE-lite, RTCP mux, auto-generated DTLS cert.
webrtc = yes
dtls_auto_generate_cert = yes
media_encryption = dtls
ice_support = yes
rtcp_mux = yes
rtp_symmetric = yes
direct_media = no

[1001]
type = aor
max_contacts = 1
remove_existing = yes

[1001]
type = auth
auth_type = userpass
username = 1001
password = voicebot-1001

; --- Extension 1002 ----------------------------------------------------------

[1002]
type = endpoint
transport = transport-ws
context = from-webrtc
aors = 1002
callerid = "Voicebot Tester 1002" <1002>
disallow = all
allow = ulaw
allow = alaw
allow = g722
webrtc = yes
dtls_auto_generate_cert = yes
media_encryption = dtls
ice_support = yes
rtcp_mux = yes
rtp_symmetric = yes
direct_media = no

[1002]
type = aor
max_contacts = 1
remove_existing = yes

[1002]
type = auth
auth_type = userpass
username = 1002
password = voicebot-1002
