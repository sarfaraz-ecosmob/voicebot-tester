; Voicebot Testing - dialplan.
; The browser SIP panel dials these destinations from extension 1001/1002.

[from-webrtc]

; 6000 - echo test: proves the full audio path (you hear yourself back).
exten => 6000,1,Answer()
 same => n,MixMonitor(/var/lib/asterisk/monitor/${UNIQUEID}.wav)
 same => n,Echo()
 same => n,Hangup()

; 7000 - mock "voicebot" destination: answers, plays a greeting, hangs up.
exten => 7000,1,Answer()
 same => n,MixMonitor(/var/lib/asterisk/monitor/${UNIQUEID}.wav)
 same => n,Playback(hello-world)      ; used when core sounds are installed
 same => n,PlayTones(660/350/300,0/150,880/400/600,0/400)  ; fallback chime (the
 same => n,Wait(2)                     ; stock image ships no sound files);
 same => n,Hangup()                    ; Wait keeps the channel up while it plays

; 7001 - reserved for the future ARI media worker (Stasis app "voicebot").
; The worker is not implemented yet (see README roadmap); until it runs, the
; call simply parks inside Stasis.
exten => 7001,1,Answer()
 same => n,MixMonitor(/var/lib/asterisk/monitor/${UNIQUEID}.wav)
 same => n,Stasis(voicebot)
 same => n,Hangup()

; Anything else is not routed.
exten => _X.,1,Hangup()
