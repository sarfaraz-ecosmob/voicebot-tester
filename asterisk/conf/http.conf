; Voicebot Testing - Asterisk HTTP/WebSocket configuration.
; ws://  (plain)  : bindport below       - zero-config default for local testing
; wss:// (TLS)    : tlsbindaddr          - requires certs in /etc/asterisk/certs
; Both serve the SIP WebSocket endpoint at path /ws

[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8080
tlsenable = yes
tlsbindaddr = 0.0.0.0:8089
tlscertfile = /etc/asterisk/certs/asterisk.crt
tlsprivatekey = /etc/asterisk/certs/asterisk.key
